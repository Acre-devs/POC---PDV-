<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Comunicação do PDV Local</title>
  <desc id="desc">Diagrama da comunicação entre dois agentes de caixa, o servidor central e o ERP Cloud.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536078; }
      .zone { fill: #f7f9fc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .zone-title { font-size: 19px; font-weight: 700; fill: #334155; }
      .node { fill: #fff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .agent { fill: #ecfdf5; stroke: #10b981; }
      .server { fill: #eff6ff; stroke: #3b82f6; }
      .database { fill: #fffbeb; stroke: #f59e0b; }
      .cloud { fill: #f5f3ff; stroke: #8b5cf6; }
      .node-title { font-size: 17px; font-weight: 700; }
      .node-text { font-size: 14px; fill: #475569; }
      .label { font-size: 14px; font-weight: 700; fill: #334155; }
      .callout { font-size: 13px; fill: #64748b; }
      .sync { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .data { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .status { stroke: #f59e0b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowAmber); }
      .future { stroke: #8b5cf6; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowPurple); }
    </style>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#16a34a"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#f59e0b"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#8b5cf6"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="70" y="65" class="title">PDV Local — Comunicação entre aplicações</text>
  <text x="70" y="95" class="subtitle">Vendas permanecem no caixa durante a contingência e são consolidadas pelo servidor quando a conexão retorna.</text>

  <rect x="55" y="140" width="510" height="620" class="zone"/>
  <text x="80" y="180" class="zone-title">Estações de caixa</text>

  <rect x="90" y="220" width="190" height="92" class="node"/>
  <text x="115" y="255" class="node-title">SPA Angular</text>
  <text x="115" y="280" class="node-text">PDV • produtos • status</text>
  <rect x="335" y="220" width="190" height="92" class="node agent"/>
  <text x="360" y="255" class="node-title">AgenteCaixa 01</text>
  <text x="360" y="280" class="node-text">ASP.NET Core :5001</text>
  <path d="M280 266 H335" class="data"/>
  <text x="282" y="250" class="callout">HTTP local</text>

  <rect x="335" y="365" width="190" height="92" class="node database"/>
  <text x="365" y="400" class="node-title">SQLite caixa 01</text>
  <text x="365" y="425" class="node-text">pdv_caixa.db</text>
  <path d="M430 312 V365" class="data"/>
  <text x="444" y="345" class="callout">vendas pendentes</text>

  <line x1="90" y1="505" x2="525" y2="505" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="90" y="550" width="190" height="92" class="node"/>
  <text x="115" y="585" class="node-title">SPA Angular</text>
  <text x="115" y="610" class="node-text">outro operador</text>
  <rect x="335" y="550" width="190" height="92" class="node agent"/>
  <text x="360" y="585" class="node-title">AgenteCaixa N</text>
  <text x="360" y="610" class="node-text">API + sincronizador</text>
  <path d="M280 596 H335" class="data"/>
  <rect x="335" y="675" width="190" height="52" class="node database"/>
  <text x="365" y="707" class="node-text">SQLite exclusivo</text>
  <path d="M430 642 V675" class="data"/>

  <rect x="690" y="190" width="440" height="500" class="zone"/>
  <text x="715" y="230" class="zone-title">Servidor central da loja — :5000</text>
  <rect x="750" y="275" width="320" height="115" class="node server"/>
  <text x="778" y="310" class="node-title">API ASP.NET Core</text>
  <text x="778" y="337" class="node-text">HealthController • ProdutosController</text>
  <text x="778" y="360" class="node-text">SincronizacaoController</text>
  <rect x="750" y="470" width="320" height="105" class="node database"/>
  <text x="778" y="510" class="node-title">Base consolidada</text>
  <text x="778" y="537" class="node-text">servidor_loja.db</text>
  <path d="M910 390 V470" class="data"/>
  <text x="925" y="438" class="callout">vendas consolidadas</text>

  <path d="M525 266 H750" class="sync"/>
  <text x="550" y="243" class="label">1. GET /api/health</text>
  <text x="550" y="264" class="callout">Verifica disponibilidade</text>
  <path d="M525 411 H650 V345 H750" class="sync"/>
  <text x="550" y="388" class="label">2. POST /api/sincronizacao/vendas</text>
  <text x="550" y="409" class="callout">Lote de vendas pendentes (JSON)</text>
  <path d="M525 596 H650 V345 H750" class="sync"/>
  <text x="548" y="625" class="callout">Caixa N usa o mesmo contrato</text>

  <path d="M750 610 H525" class="status"/>
  <text x="560" y="661" class="label">3. Resposta de sucesso</text>
  <text x="560" y="682" class="callout">Agente marca a venda como sincronizada</text>

  <rect x="1210" y="295" width="300" height="110" class="node cloud"/>
  <text x="1240" y="335" class="node-title">ERP Cloud</text>
  <text x="1240" y="362" class="node-text">Integração assíncrona futura</text>
  <path d="M1130 345 H1210" class="future"/>
  <text x="1145" y="325" class="callout">dados centralizados</text>

  <rect x="1210" y="500" width="300" height="110" class="node"/>
  <text x="1240" y="540" class="node-title">App de gestão</text>
  <text x="1240" y="567" class="node-text">Catálogo • estoque • relatórios</text>
  <path d="M1070 530 H1210" class="status"/>

  <rect x="80" y="805" width="1440" height="55" fill="#f8fafc" stroke="#e2e8f0" rx="10"/>
  <line x1="110" y1="832" x2="155" y2="832" class="data"/><text x="170" y="837" class="callout">Operação local / persistência</text>
  <line x1="405" y1="832" x2="450" y2="832" class="sync"/><text x="465" y="837" class="callout">Sincronização HTTP</text>
  <line x1="695" y1="832" x2="740" y2="832" class="status"/><text x="755" y="837" class="callout">Consulta / confirmação</text>
  <line x1="1040" y1="832" x2="1085" y2="832" class="future"/><text x="1100" y="837" class="callout">Integração futura</text>
</svg>
